# https://contributors.home-assistant.io/apps/reference/configuration/
name: Headscale
version: "0.2.0"
slug: headscale
description: >-
  Self-hosted Tailscale control server (Headscale) with built-in TLS, DERP relay,
  subnet router, Headplane admin UI and remote printer access.
url: "https://github.com/studiotijn/headscale-ha/tree/main/headscale"
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
# No `image:` yet: Home Assistant builds the container on the device from the
# Dockerfile. Add `image: "ghcr.io/studiotijn/headscale-ha"` once the repository
# is public and CI publishes images.

# Headscale must bind the public ports directly (TLS, DERP/STUN) and the subnet
# router must reach the LAN, so the app runs on the host network.
host_network: true
ingress: true
ingress_port: 0
ingress_stream: true
panel_icon: mdi:vpn
panel_title: Headscale
panel_admin: true

hassio_api: true
hassio_role: default
privileged:
  - NET_ADMIN
  - NET_RAW
devices:
  - /dev/net/tun
map:
  - ssl:ro

backup: hot
backup_exclude:
  - "*.log"
  - "tailscale/logs/*"

options:
  server_url: "https://hs.example.duckdns.org"
  tls_mode: letsencrypt
  acme_email: ""
  certfile: fullchain.pem
  keyfile: privkey.pem
  listen_port: 443
  derp_enabled: true
  stun_port: 3478
  tailscale_derp_fallback: true
  base_domain: tailnet.home
  nameservers:
    - 1.1.1.1
    - 9.9.9.9
  admin_user: admin
  node_expiry_days: 180
  subnet_router: true
  advertise_routes: []
  exit_node: false
  userspace_networking: true
  headplane: true
  headplane_port: 3000
  log_level: info
schema:
  server_url: url
  tls_mode: list(letsencrypt|ha_certificate|none)
  acme_email: email?
  certfile: str
  keyfile: str
  listen_port: port
  derp_enabled: bool
  stun_port: port
  tailscale_derp_fallback: bool
  base_domain: match(^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$)
  nameservers:
    - str
  admin_user: match(^[a-z0-9][a-z0-9._-]{0,62}$)
  node_expiry_days: int(0,3650)
  subnet_router: bool
  advertise_routes:
    - match(^[0-9a-fA-F:.]+/[0-9]{1,3}$)
  exit_node: bool
  userspace_networking: bool
  headplane: bool
  headplane_port: port
  log_level: list(trace|debug|info|warn|error)
