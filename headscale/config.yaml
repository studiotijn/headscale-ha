# https://contributors.home-assistant.io/apps/reference/configuration/
name: Headscale
version: "0.10.0"
slug: headscale
description: >-
  Self-hosted Tailscale control server (Headscale) with DERP relay, subnet router,
  setup wizard, Headplane admin UI and remote printer access.
url: "https://github.com/studiotijn/headscale-ha/tree/main/headscale"
arch:
  - aarch64
  - amd64
init: false
# No `image:` yet: Home Assistant builds the container on the device from the
# Dockerfile. Add `image: "ghcr.io/studiotijn/headscale-ha"` once the repository
# is public and CI publishes images.

# Headscale must bind the public ports directly (TLS, DERP/STUN) and the subnet
# router must reach the LAN, so the app runs on the host network.
host_network: true
ingress: true
ingress_port: 0
ingress_stream: true
panel_icon: mdi:vpn
panel_title: Headscale

hassio_api: true
# manager: needed for the in-app "check for updates / update / rebuild" buttons.
hassio_role: manager
privileged:
  - NET_ADMIN
  - NET_RAW
devices:
  - /dev/net/tun
map:
  - ssl:ro

backup_exclude:
  - "*.log"
  - "tailscale/logs/*"

options:
  server_url: "https://hs.example.duckdns.org"
  tls_mode: ha_certificate
  certfile: fullchain.pem
  keyfile: privkey.pem
  listen_port: 443
  derp_enabled: true
  stun_port: 3478
  tailscale_derp_fallback: true
  base_domain: tailnet.home
  nameservers:
    - 1.1.1.1
    - 9.9.9.9
  admin_user: admin
  node_expiry_days: 180
  subnet_router: true
  advertise_routes: []
  exit_node: false
  userspace_networking: true
  headplane: true
  headplane_port: 3000
  airprint_dns: false
  dns_via_home: false
  multi_tenant: false
  printer_domain: printers.home.arpa
  log_level: info
schema:
  server_url: url
  # "letsencrypt" and acme_email only remain so existing configurations stay valid; the
  # app then asks (in the setup wizard) to switch to a certificate from /ssl.
  tls_mode: list(ha_certificate|none|letsencrypt)
  acme_email: email?
  certfile: str
  keyfile: str
  listen_port: port
  derp_enabled: bool
  stun_port: port
  tailscale_derp_fallback: bool
  base_domain: match(^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$)
  nameservers:
    - str
  admin_user: match(^[a-z0-9][a-z0-9._-]{0,62}$)
  node_expiry_days: int(0,3650)
  subnet_router: bool
  advertise_routes:
    - match(^[0-9a-fA-F:.]+/[0-9]{1,3}$)
  exit_node: bool
  userspace_networking: bool
  headplane: bool
  headplane_port: port
  airprint_dns: bool
  dns_via_home: bool
  multi_tenant: bool
  printer_domain: match(^[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+$)
  log_level: list(trace|debug|info|warn|error)
