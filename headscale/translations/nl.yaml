configuration:
  server_url:
    name: Server-URL
    description: Publieke URL van Headscale, bijv. https://hs.jouwnaam.duckdns.org. Apparaten verbinden hiermee.
  tls_mode:
    name: TLS-modus
    description: >-
      Bron van het certificaat. ha_certificate = een certificaat uit /ssl van de Let's Encrypt- of Duck DNS-app (aanbevolen); none = gewoon HTTP achter je eigen reverse proxy. De ingebouwde letsencrypt-modus is verwijderd.
  acme_email:
    name: Let's Encrypt-e-mail
    description: Wordt niet meer gebruikt (het certificaat komt van de Let's Encrypt- of Duck DNS-app).
  certfile:
    name: Certificaatbestand
    description: Bestand in /ssl, voor TLS-modus ha_certificate.
  keyfile:
    name: Sleutelbestand
    description: Bestand in /ssl, voor TLS-modus ha_certificate.
  listen_port:
    name: Luisterpoort
    description: TCP-poort waarop Headscale (en de DERP-relay) luistert. Stel port forwarding in op je router.
  derp_enabled:
    name: Ingebouwde DERP-relay
    description: Verkeer via je eigen server doorsturen als apparaten niet direct kunnen verbinden. De STUN-poort (UDP) moet geforward zijn.
  stun_port:
    name: STUN-poort (UDP)
    description: UDP-poort van de STUN-server van de ingebouwde DERP.
  tailscale_derp_fallback:
    name: Tailscale-relays als reserve
    description: Ook de publieke DERP-relays van Tailscale aanbieden. Verkeer blijft end-to-end versleuteld; alleen metadata gaat via hen.
  base_domain:
    name: Tailnet-domein
    description: MagicDNS-domein voor je apparaten, bijv. tailnet.home. Mag niet overlappen met het domein van de server-URL.
  nameservers:
    name: DNS-servers
    description: DNS-servers die apparaten in het tailnet krijgen.
  admin_user:
    name: Gebruiker thuisnetwerk
    description: Headscale-gebruiker die eigenaar is van de apparaten van het thuisnetwerk. Met multi-tenant netwerken zet de app dit op de ID van het thuisnetwerk.
  node_expiry_days:
    name: Verloop apparaatsleutel (dagen)
    description: Apparaten moeten na zoveel dagen opnieuw inloggen. 0 = nooit (afgeraden). Getagde apparaten verlopen nooit.
  subnet_router:
    name: Subnet-router
    description: Maak je thuisnetwerk (en toegevoegde printers) bereikbaar vanuit het tailnet.
  advertise_routes:
    name: Te adverteren routes
    description: Netwerken die bereikbaar worden, bijv. 192.168.1.0/24. Leeg = het LAN van de Home Assistant-host.
  exit_node:
    name: Exit-node
    description: Apparaten mogen al hun internetverkeer via je thuisverbinding sturen.
  userspace_networking:
    name: Userspace-netwerk
    description: Subnet-router zonder kernel-netwerkinterface. Aanbevolen; zet alleen uit als je kernel-routing nodig hebt.
  headplane:
    name: Headplane-beheer-UI
    description: Draai de Headplane-webinterface op je LAN voor gebruikers, ACL's en DNS.
  headplane_port:
    name: Headplane-poort
    description: TCP-poort van Headplane op je LAN (http://homeassistant.local:POORT/admin). Forward deze poort niet.
  airprint_dns:
    name: AirPrint via VPN (experimenteel)
    description: Publiceer de toegevoegde printers via DNS-SD, zodat iPhones, iPads en Macs ze via Tailscale vinden.
  dns_via_home:
    name: Alle DNS via thuis
    description: Stuur alle DNS-vragen van tailnet-apparaten naar deze Home Assistant (bijv. AdGuard Home). Onderweg werkt DNS dan niet als thuis plat ligt.
  multi_tenant:
    name: Multi-tenant netwerken (optioneel)
    description: >-
      Beheer meerdere gescheiden netwerken in één Headscale: domeinen (binnen alles verbonden) en clusters (binnen dicht), met locaties achter een gateway. Toegang tussen netwerken staat dicht tot je een verbinding toevoegt. Na aanzetten: tabblad Netwerken → Activeren. dns_via_home wordt dan genegeerd.
  printer_domain:
    name: Printerdomein
    description: DNS-SD-domein voor AirPrint, bijv. printers.home.arpa.
  log_level:
    name: Logniveau
    description: Hoeveel de app logt.
